name: Dependency Lock Sync

on:
  push:
    branches:
      - creator/real-pqc-x402-remediation

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin HEAD:creator/real-pqc-x402-remediation

name: CI & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & TypeScript Typecheck
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: TypeScript Static Typecheck
        run: npm run lint

      - name: Production Bundle Build (Vite & Server)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Build Artifacts
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/server.cjs
          echo "All production artifacts successfully verified."

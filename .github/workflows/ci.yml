name: CI & Technical Reality Verification

on:
  push:
    branches: [ main, master, 'repair/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Typecheck, Security Tests & Reality Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run lint

      - name: Automated Unit & Reality Tests
        run: npm test

      - name: NIST FIPS 203/204 Post-Quantum Tests
        run: npm run test:nist

      - name: Adversarial Security & Replay Attacks Regression
        run: npm run test:adversarial

      - name: Standalone Cryptographic Auditor
        run: npm run audit:crypto

      - name: Universal Reality System (URS v1.0) Execution
        run: npm run reality:universal

      - name: Algorand TestNet Staging Preflight
        run: npm run testnet:preflight

      - name: Production Bundle Build (Vite & Server)
        run: npm run build:all
        env:
          NODE_ENV: production

      - name: Verify Build Artifacts
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/server.cjs
          echo "All production artifacts successfully verified."

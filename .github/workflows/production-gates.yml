name: THE CREATOR Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production claim gate
        run: npm run production:claim-gate

      - name: Type check
        run: npm run lint

      - name: Reality gate
        run: npm run reality:gate

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build:all
